<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio desk | VN crochet</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!--
    The desk shell is injected by admin.js after authentication.
    An unauthenticated visitor only ever sees the login form below.
  -->
  <div id="app">
    <!-- Login screen shown by default — replaced by desk shell after login -->
    <div class="login-shell">
      <div class="login-card">
        <div class="login-brand"><span>🧶</span><strong>VN crochet</strong><small>Studio desk</small></div>
        <h1>Sign in</h1>
        <p class="login-error" id="loginErr" role="alert" hidden></p>
        <form id="loginForm">
          <label>Username<input id="loginUser" type="text" autocomplete="username" required placeholder="admin"></label>
          <label>Password<input id="loginPass" type="password" autocomplete="current-password" required placeholder="••••••••"></label>
          <button type="submit" id="loginBtn">Sign in</button>
        </form>
      </div>
    </div>
  </div>
  <script type="module" src="admin.js"></script>
</body>
</html>
