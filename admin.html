<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Desk - VN Crochet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #333; margin-bottom: 30px; }
    .login-form, .admin-panel { display: none; }
    .login-form.active, .admin-panel.active { display: block; }
    input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: 600; }
    button:hover { background: #0056b3; }
    .product-list { margin-top: 30px; }
    .product-item { padding: 15px; background: #f9f9f9; margin: 10px 0; border-radius: 6px; }
    .error { color: red; margin: 10px 0; }
    .success { color: green; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧶 Admin Desk</h1>
    
    <div class="login-form active" id="loginForm">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="login()">Login</button>
      <div class="error" id="loginError"></div>
    </div>
    
    <div class="admin-panel" id="adminPanel">
      <h2>Add Product</h2>
      <input type="text" id="productName" placeholder="Product Name">
      <input type="text" id="productEmoji" placeholder="Emoji (e.g., 🍄)">
      <input type="text" id="productCategory" placeholder="Category (Forest/Pond/Meadow)">
      <input type="number" id="productPrice" placeholder="Price in ₹">
      <input type="text" id="productSize" placeholder="Size (e.g., 12 cm)">
      <textarea id="productDescription" placeholder="Description" rows="3"></textarea>
      <textarea id="productCare" placeholder="Care instructions" rows="2"></textarea>
      <input type="number" id="productStock" placeholder="Stock quantity">
      <button onclick="addProduct()">Add Product</button>
      <div class="success" id="addSuccess"></div>
      <div class="error" id="addError"></div>
      
      <div class="product-list">
        <h2>Current Products</h2>
        <div id="productsList">Loading...</div>
      </div>
    </div>
  </div>
  
  <script>
    let authToken = localStorage.getItem('adminToken');
    
    if (authToken) {
      showAdminPanel();
    }
    
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        if (data.success) {
          authToken = data.token;
          localStorage.setItem('adminToken', authToken);
          showAdminPanel();
        } else {
          document.getElementById('loginError').textContent = 'Invalid credentials';
        }
      } catch (err) {
        document.getElementById('loginError').textContent = 'Login failed: ' + err.message;
      }
    }
    
    function showAdminPanel() {
      document.getElementById('loginForm').classList.remove('active');
      document.getElementById('adminPanel').classList.add('active');
      loadProducts();
    }
    
    async function loadProducts() {
      try {
        const res = await fetch('/api/catalog');
        const products = await res.json();
        const list = document.getElementById('productsList');
        
        if (products.length === 0) {
          list.innerHTML = '<p>No products yet. Add your first product above!</p>';
        } else {
          list.innerHTML = products.map(p => `
            <div class="product-item">
              <strong>${p.e} ${p.n}</strong> - ₹${p.p} - Stock: ${p.stock}
            </div>
          `).join('');
        }
      } catch (err) {
        document.getElementById('productsList').innerHTML = 'Failed to load products';
      }
    }
    
    async function addProduct() {
      const product = {
        id: Date.now().toString(),
        n: document.getElementById('productName').value,
        e: document.getElementById('productEmoji').value,
        c: document.getElementById('productCategory').value,
        p: parseInt(document.getElementById('productPrice').value),
        lv: 2,
        bg: '#ffc9c9',
        s: document.getElementById('productSize').value,
        m: [['Cotton yarn', '2 skeins']],
        d: document.getElementById('productDescription').value,
        care: document.getElementById('productCare').value,
        stock: parseInt(document.getElementById('productStock').value),
        featured: true,
        active: true
      };
      
      try {
        const res = await fetch('/api/catalog', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Basic ${authToken}`
          },
          body: JSON.stringify(product)
        });
        
        const data = await res.json();
        if (data.success) {
          document.getElementById('addSuccess').textContent = 'Product added successfully!';
          document.getElementById('addError').textContent = '';
          setTimeout(() => document.getElementById('addSuccess').textContent = '', 3000);
          loadProducts();
          
          // Clear form
          document.getElementById('productName').value = '';
          document.getElementById('productEmoji').value = '';
          document.getElementById('productCategory').value = '';
          document.getElementById('productPrice').value = '';
          document.getElementById('productSize').value = '';
          document.getElementById('productDescription').value = '';
          document.getElementById('productCare').value = '';
          document.getElementById('productStock').value = '';
        } else {
          document.getElementById('addError').textContent = 'Failed to add product';
        }
      } catch (err) {
        document.getElementById('addError').textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
